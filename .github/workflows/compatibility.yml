name: Compatibility

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Python 3.14 / ${{ matrix.os }} / ${{ matrix.resolution }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        resolution: [lowest-direct, highest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: x64
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false
      - name: Check Linux setup syntax
        if: runner.os == 'Linux'
        run: bash -n scripts/setup-linux.sh
      - name: Check Windows setup syntax
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/scripts/setup-windows.ps1", [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count) {
            $parseErrors | Write-Error
            exit 1
          }
      - name: Install runtime dependencies
        run: |
          uv venv --python python
          uv pip install -r pyproject.toml --resolution ${{ matrix.resolution }}
      - name: Build and install AutoScrapper
        run: uv pip install --no-deps .
      - name: Check dependency consistency
        run: uv pip check
      - name: Run compatibility tests
        run: uv run --no-sync python -m unittest discover -s tests
