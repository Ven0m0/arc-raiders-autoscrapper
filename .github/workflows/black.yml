name: Black

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==26.1.0
      - name: Check formatting
        run: python -m black --check .
